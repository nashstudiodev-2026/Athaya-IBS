<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDN 1 Tasikhargo</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#2563eb',
                            dark: '#1e3a8a',
                            light: '#eff6ff'
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <style>
        html { scroll-behavior: smooth; }
        .nav-dropdown {
            visibility: hidden;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        .nav-item:hover .nav-dropdown {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }
        .curved-edge {
            border-bottom-right-radius: 80px;
        }
        /* Scrollbar custom */
        .wa-popup::-webkit-scrollbar, .prose::-webkit-scrollbar, #mobile-menu::-webkit-scrollbar { width: 4px; }
        .wa-popup::-webkit-scrollbar-thumb, .prose::-webkit-scrollbar-thumb, #mobile-menu::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Modal Transition */
        #lightbox { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased relative">

    <!-- Header Navigation -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-100 shadow-sm transition-all">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            
            <a href="javascript:void(0)" onclick="showView('view-home')" class="flex items-center gap-3">
                <img id="logo-img" src="" alt="Logo" class="w-10 h-10 md:w-12 md:h-12 object-contain rounded-full shadow-sm bg-white p-0.5">
                <span id="logo-text" class="font-bold text-lg md:text-xl tracking-tight text-slate-800"></span>
            </a>

            <!-- Desktop Nav -->
            <nav class="hidden lg:flex items-center gap-8 text-[13px] font-semibold text-slate-600" id="nav-container">
                <!-- Injected via JS -->
            </nav>

            <a href="#footer-contact" onclick="document.getElementById('footer-contact').scrollIntoView({behavior:'smooth'})" class="hidden lg:inline-block bg-brand-blue hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-md shadow-blue-500/30">
                Hubungi Kami
            </a>

            <!-- Mobile Menu Toggle Button -->
            <button id="mobile-menu-btn" class="lg:hidden text-slate-600 p-2 focus:outline-none hover:bg-slate-100 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

    <!-- MOBILE NAVIGATION (SLIDE FROM RIGHT) -->
    <!-- Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden opacity-0 transition-opacity duration-300"></div>
    
    <!-- Sidebar -->
    <div id="mobile-menu" class="fixed top-0 right-0 h-full w-72 bg-white z-50 transform translate-x-full transition-transform duration-300 overflow-y-auto shadow-2xl flex flex-col">
        <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
            <span class="font-bold text-slate-800">Menu Navigasi</span>
            <button id="mobile-close-btn" class="text-slate-500 hover:text-red-500 bg-white p-1.5 rounded-md shadow-sm border border-slate-200 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>
        <nav class="flex-1 p-5 space-y-1 text-sm font-semibold text-slate-700" id="mobile-nav-container">
            <!-- Injected via JS -->
        </nav>
    </div>

    <!-- VIEWS CONTAINER -->
    <main id="main-content">

        <!-- ========================================== -->
        <!-- VIEW 1: HOME (Beranda Utama)               -->
        <!-- ========================================== -->
        <div id="view-home" class="block">
            
            <!-- Hero Section -->
            <section class="max-w-7xl mx-auto px-6 py-12 lg:py-24 grid lg:grid-cols-2 gap-12 items-center">
                <div class="space-y-6">
                    <h1 id="hero-title" class="text-4xl lg:text-5xl font-extrabold text-slate-900 leading-[1.15] tracking-tight"></h1>
                    <p id="hero-desc" class="text-slate-600 text-base lg:text-lg leading-relaxed max-w-lg"></p>
                    <div class="pt-4">
                        <a href="javascript:void(0)" id="hero-cta" onclick="document.getElementById('ppdb').scrollIntoView({behavior:'smooth'})" class="inline-block bg-brand-blue hover:bg-blue-700 text-white px-8 py-3.5 rounded-lg text-sm font-semibold transition-colors shadow-lg shadow-blue-500/40"></a>
                    </div>
                </div>
                <div class="relative flex justify-center lg:justify-end mt-10 lg:mt-0">
                    <div class="absolute inset-0 bg-gradient-to-tr from-brand-light to-white rounded-[3rem] -z-10 transform translate-x-4 translate-y-4 shadow-soft"></div>
                    <img id="hero-img" src="" alt="Hero Composition" class="w-full max-w-lg rounded-2xl shadow-2xl object-cover hover:scale-[1.01] transition-transform duration-500 bg-white p-2">
                    <!-- Badge diperkecil sesuai request -->
                    <img id="hero-badge" src="" class="absolute -top-4 -right-2 lg:-right-4 w-20 lg:w-24 shadow-lg rounded-md border-2 border-white bg-white" alt="Badge">
                </div>
            </section>

            <!-- Profil Section -->
            <section id="profil" class="max-w-7xl mx-auto px-6 py-20 space-y-24">
                <!-- Profil Singkat -->
                <div class="grid lg:grid-cols-2 gap-16 items-center">
                    <div>
                        <span id="about-badge" class="inline-block bg-brand-blue text-white text-xs font-bold px-3 py-1.5 rounded-md mb-6"></span>
                        <p id="about-desc" class="text-slate-600 text-lg leading-relaxed"></p>
                    </div>
                    <div class="relative">
                        <img id="about-img" src="" alt="Gedung" class="w-full rounded-2xl shadow-xl curved-edge object-cover h-80 cursor-pointer hover:opacity-90 transition-opacity" onclick="openLightbox(this.src)">
                    </div>
                </div>

                <!-- Visi Misi -->
                <div class="grid lg:grid-cols-2 gap-16 items-center">
                    <div class="order-2 lg:order-1 relative">
                        <img id="vm-img" src="" alt="Siswa" class="w-full rounded-2xl shadow-xl object-cover h-[400px] cursor-pointer hover:opacity-90 transition-opacity" onclick="openLightbox(this.src)">
                    </div>
                    <div class="order-1 lg:order-2 space-y-8">
                        <div>
                            <span id="visi-badge" class="inline-block bg-brand-blue text-white text-xs font-bold px-3 py-1.5 rounded-md mb-4"></span>
                            <p id="visi-text" class="text-slate-700 text-lg font-medium leading-relaxed"></p>
                        </div>
                        <div>
                            <span id="misi-badge" class="inline-block bg-brand-blue text-white text-xs font-bold px-3 py-1.5 rounded-md mb-4"></span>
                            <ul id="misi-list" class="space-y-3 text-slate-600"></ul>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Program Unggulan Section -->
            <section class="bg-white py-20 border-t border-slate-100">
                <div class="max-w-7xl mx-auto px-6 text-center">
                    <h2 id="feat-title" class="text-3xl font-bold text-slate-900 mb-2"></h2>
                    <p id="feat-subtitle" class="text-slate-500 mb-12"></p>
                    <div class="grid md:grid-cols-3 gap-6" id="features-container"></div>
                </div>
            </section>

            <!-- Fasilitas Section -->
            <section id="fasilitas" class="max-w-7xl mx-auto px-6 py-20 border-t border-slate-100">
                <div class="text-center mb-12">
                    <h2 id="fac-title" class="text-3xl font-bold text-slate-900 mb-2"></h2>
                    <p id="fac-subtitle" class="text-slate-500"></p>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="facilities-container"></div>
            </section>

            <!-- Galeri Section -->
            <section id="galeri" class="bg-slate-100 py-20">
                <div class="max-w-7xl mx-auto px-6">
                    <div class="text-center mb-12">
                        <h2 id="gal-title" class="text-3xl font-bold text-slate-900 mb-2"></h2>
                        <p id="gal-subtitle" class="text-slate-500"></p>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="gallery-container"></div>
                </div>
            </section>

            <!-- PPDB Section -->
            <section id="ppdb" class="max-w-7xl mx-auto px-6 py-20 border-t border-slate-100">
                <div class="bg-brand-blue rounded-3xl p-10 md:p-16 text-white grid md:grid-cols-2 gap-12 items-center shadow-2xl shadow-blue-500/20 relative overflow-hidden">
                    <!-- Pattern Deco -->
                    <div class="absolute top-0 right-0 opacity-10">
                        <svg width="400" height="400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2zm0 4l7.5 15h-15L12 6z"/></svg>
                    </div>
                    
                    <div class="relative z-10 space-y-6">
                        <h2 id="ppdb-title" class="text-3xl lg:text-4xl font-bold leading-tight"></h2>
                        <p id="ppdb-desc" class="text-blue-100 leading-relaxed"></p>
                        <a id="ppdb-link" href="#" target="_blank" class="inline-block bg-white text-brand-blue px-8 py-3.5 rounded-lg text-sm font-bold shadow-lg hover:scale-105 transition-transform mt-4">
                            Isi Formulir Pendaftaran
                        </a>
                    </div>
                    <div class="relative z-10 bg-white/10 p-6 md:p-8 rounded-2xl backdrop-blur-sm border border-white/20">
                        <h3 class="font-bold text-xl mb-4">Persyaratan Berkas:</h3>
                        <ul id="ppdb-reqs" class="space-y-3 text-blue-50 text-sm"></ul>
                    </div>
                </div>
            </section>

            <!-- Berita & Artikel (Home - Max 4) -->
            <section id="berita" class="bg-white py-20 border-t border-slate-100">
                <div class="max-w-7xl mx-auto px-6">
                    <div class="flex justify-between items-end mb-10 border-b border-slate-100 pb-4">
                        <h2 id="news-title-home" class="text-3xl font-bold text-slate-900"></h2>
                        <button onclick="showView('view-news-all')" class="hidden md:inline-flex items-center gap-2 text-brand-blue font-bold hover:text-blue-800 transition-colors bg-blue-50 px-4 py-2 rounded-lg">
                            Lihat Selengkapnya &rarr;
                        </button>
                    </div>
                    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6" id="news-container-home"></div>
                    <div class="mt-10 text-center md:hidden">
                        <button onclick="showView('view-news-all')" class="w-full inline-block bg-brand-blue text-white px-6 py-3.5 rounded-lg text-sm font-semibold shadow-lg hover:bg-blue-700 transition-colors">
                            Lihat Semua Berita & Artikel
                        </button>
                    </div>
                </div>
            </section>
        </div>
        
        <!-- ========================================== -->
        <!-- VIEW 2: SEMUA BERITA (Daftar Lengkap)      -->
        <!-- ========================================== -->
        <div id="view-news-all" class="hidden bg-slate-50 min-h-screen py-12">
            <div class="max-w-7xl mx-auto px-6">
                <button onclick="showView('view-home')" class="mb-8 inline-flex items-center gap-2 text-slate-500 hover:text-brand-blue font-medium transition-colors bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200">
                    &larr; Kembali ke Beranda
                </button>
                <h2 id="news-title-all" class="text-3xl font-bold text-slate-900 mb-10 border-b pb-4">Semua Berita & Artikel</h2>
                <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="news-container-all"></div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VIEW 3: DETAIL BERITA (Halaman Blog)       -->
        <!-- ========================================== -->
        <div id="view-news-detail" class="hidden bg-white min-h-screen py-12">
            <div class="max-w-3xl mx-auto px-6">
                <button onclick="showView('view-news-all')" class="mb-8 inline-flex items-center gap-2 text-slate-500 hover:text-brand-blue font-medium transition-colors bg-slate-50 px-4 py-2 rounded-lg border border-slate-200">
                    &larr; Kembali ke Daftar Berita
                </button>
                
                <div class="space-y-6">
                    <div id="detail-tags" class="flex gap-2 flex-wrap"></div>
                    <h1 id="detail-title" class="text-3xl md:text-4xl font-extrabold text-slate-900 leading-tight"></h1>
                    <div class="flex items-center text-sm text-slate-500 font-medium uppercase tracking-wide gap-3 pb-6 border-b">
                        <span id="detail-author" class="font-bold text-brand-blue"></span>
                        <span>&bull;</span>
                        <span id="detail-date"></span>
                    </div>
                    <img id="detail-img" src="" class="w-full rounded-2xl shadow-md object-cover h-[300px] md:h-[450px]" alt="Cover">
                    <div id="detail-content" class="prose prose-blue max-w-none text-slate-700 leading-loose text-lg py-6">
                        <!-- Content injected via JS -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer id="footer-contact" class="bg-brand-blue text-white pt-16 pb-8 border-t-4 border-blue-400">
        <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 lg:grid-cols-4 gap-12 mb-12">
            <div>
                <h3 id="footer-col1-title" class="font-bold text-lg mb-4"></h3>
                <p id="footer-col1-desc" class="text-blue-100 text-sm leading-relaxed"></p>
            </div>
            <div>
                <h3 id="footer-col2-title" class="font-bold text-lg mb-4"></h3>
                <p id="footer-col2-content" class="text-blue-100 text-sm leading-relaxed whitespace-pre-line"></p>
            </div>
            <div>
                <h3 id="footer-col3-title" class="font-bold text-lg mb-4">Social Media</h3>
                <div class="flex gap-4" id="footer-socials"></div>
            </div>
            <div class="bg-white/10 p-2 rounded-xl">
                <iframe id="footer-map" src="" class="w-full h-40 rounded-lg border-0" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
        <div class="max-w-7xl mx-auto px-6 border-t border-blue-500/50 pt-8 text-center text-blue-200 text-sm">
            <p id="footer-copy"></p>
        </div>
    </footer>

    <!-- WhatsApp Widget -->
    <div class="fixed bottom-6 right-6 z-40">
        <div id="wa-popup" class="hidden absolute bottom-16 right-0 w-80 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden transition-all origin-bottom-right">
            <div class="bg-[#25D366] p-5 text-white">
                <h4 id="wa-greeting" class="font-bold text-lg"></h4>
                <p id="wa-subgreeting" class="text-sm opacity-90"></p>
            </div>
            <div class="p-4 bg-slate-50 text-xs text-slate-500 text-center border-b border-slate-100">
                <span id="wa-reply-time"></span>
            </div>
            <div class="p-2 max-h-64 overflow-y-auto" id="wa-contacts"></div>
        </div>
        <button id="wa-toggle" class="bg-[#25D366] hover:bg-[#20b858] text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg transition-transform hover:scale-110 relative group">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
            </svg>
            <!-- Tooltip -->
            <span class="absolute right-16 bg-white text-slate-800 text-xs font-bold px-3 py-1.5 rounded-lg shadow-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Hubungi Kami</span>
        </button>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 bg-black/95 z-[100] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="closeLightbox(event)">
        <button class="absolute top-6 right-6 text-white hover:text-gray-300 p-2 bg-white/10 rounded-full transition-colors" onclick="closeLightbox(event, true)">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain pointer-events-none border border-white/10">
    </div>

    <script>
        let globalData = null;

        // View Management (SPA)
        function showView(viewId) {
            const views = ['view-home', 'view-news-all', 'view-news-detail'];
            views.forEach(id => {
                const el = document.getElementById(id);
                if(id === viewId) {
                    el.classList.remove('hidden');
                    el.classList.add('block');
                } else {
                    el.classList.remove('block');
                    el.classList.add('hidden');
                }
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // News Detail Handler
        function openNewsDetail(index) {
            const item = globalData.news.items[index];
            if(!item) return;

            document.getElementById('detail-title').textContent = item.title;
            document.getElementById('detail-author').textContent = item.author;
            document.getElementById('detail-date').textContent = item.date;
            document.getElementById('detail-img').src = item.imageUrl;
            document.getElementById('detail-content').innerHTML = item.content || "<p>Konten tidak tersedia.</p>";
            
            let tags = item.categories.map(cat => `<span class="bg-brand-blue text-white text-[10px] font-bold px-2 py-1 rounded-sm">${cat}</span>`).join('');
            document.getElementById('detail-tags').innerHTML = tags;

            showView('view-news-detail');
        }

        // Lightbox Functions
        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('lightbox');
            const lImg = document.getElementById('lightbox-img');
            lImg.src = imgSrc;
            lightbox.classList.remove('hidden');
            setTimeout(() => lightbox.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden'; // Lock scroll
        }

        function closeLightbox(e, force = false) {
            if (force || e.target.id === 'lightbox') {
                const lightbox = document.getElementById('lightbox');
                lightbox.classList.add('opacity-0');
                document.body.style.overflow = ''; // Unlock scroll
                setTimeout(() => {
                    lightbox.classList.add('hidden');
                    document.getElementById('lightbox-img').src = '';
                }, 300);
            }
        }

        // Mobile Menu Logic (Slide from Right)
        const mobileBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const mobileOverlay = document.getElementById('mobile-overlay');
        const mobileCloseBtn = document.getElementById('mobile-close-btn');

        function toggleMobileMenu(show) {
            if (show) {
                mobileOverlay.classList.remove('hidden');
                setTimeout(() => mobileOverlay.classList.remove('opacity-0'), 10);
                mobileMenu.classList.remove('translate-x-full');
                document.body.style.overflow = 'hidden'; // Lock background scroll
            } else {
                mobileOverlay.classList.add('opacity-0');
                mobileMenu.classList.add('translate-x-full');
                document.body.style.overflow = ''; // Restore background scroll
                setTimeout(() => mobileOverlay.classList.add('hidden'), 300);
            }
        }

        mobileBtn.addEventListener('click', () => toggleMobileMenu(true));
        mobileCloseBtn.addEventListener('click', () => toggleMobileMenu(false));
        mobileOverlay.addEventListener('click', () => toggleMobileMenu(false));

        // Data Fetching and Injecting
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Fetch using cache busting in dev, but standard in prod
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Data tidak ditemukan');
                globalData = await response.json();
                const data = globalData;

                // 1. Populate Header & Nav
                document.getElementById('logo-img').src = data.school.logoUrl;
                document.getElementById('logo-text').textContent = data.school.shortName;

                const navContainer = document.getElementById('nav-container');
                const mobNavContainer = document.getElementById('mobile-nav-container');
                let navHtml = '';
                let mobNavHtml = '';

                data.navigation.forEach(item => {
                    const isAnchor = item.url.startsWith('#') && item.url !== '#';
                    const targetId = isAnchor ? item.url.replace('#', '') : '';
                    
                    // Logic click: If anchor, go to home view first, then scroll
                    const clickAction = isAnchor ? `onclick="showView('view-home'); setTimeout(() => { const el = document.getElementById('${targetId}'); if(el) el.scrollIntoView({behavior:'smooth'}); }, 100); toggleMobileMenu(false);"` : `href="${item.url}" onclick="toggleMobileMenu(false)"`;

                    if (item.dropdown) {
                        let subItems = item.items.map(sub => `<a href="${sub.url}" class="block px-4 py-2 hover:bg-slate-700 transition-colors">${sub.label}</a>`).join('');
                        let mobSubItems = item.items.map(sub => `<a href="${sub.url}" class="block py-2 text-slate-500 pl-4 hover:text-brand-blue" onclick="toggleMobileMenu(false)">${sub.label}</a>`).join('');
                        
                        navHtml += `
                            <div class="relative group nav-item py-4">
                                <button class="flex items-center gap-1 hover:text-brand-blue transition-colors focus:outline-none">
                                    ${item.label} <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                                <div class="nav-dropdown absolute top-full left-0 mt-0 w-56 bg-slate-800 text-white rounded-lg shadow-xl overflow-hidden py-2 border border-slate-700">
                                    ${subItems}
                                </div>
                            </div>
                        `;
                        mobNavHtml += `
                            <div class="border-b border-slate-100 pb-2 mb-2">
                                <span class="block py-2 text-slate-400 font-bold">${item.label}</span>
                                <div class="flex flex-col">${mobSubItems}</div>
                            </div>
                        `;
                    } else {
                        // Desktop Nav
                        navHtml += `<a ${isAnchor ? 'href="javascript:void(0)"' : `href="${item.url}"`} ${clickAction} class="hover:text-brand-blue transition-colors py-4">${item.label}</a>`;
                        // Mobile Nav
                        mobNavHtml += `<a ${isAnchor ? 'href="javascript:void(0)"' : `href="${item.url}"`} ${clickAction} class="block py-3 border-b border-slate-100 hover:text-brand-blue hover:pl-2 transition-all">${item.label}</a>`;
                    }
                });
                navContainer.innerHTML = navHtml;
                mobNavContainer.innerHTML = mobNavHtml;

                // 2. Populate Hero
                document.getElementById('hero-title').textContent = data.hero.title;
                document.getElementById('hero-desc').textContent = data.hero.description;
                document.getElementById('hero-cta').textContent = data.hero.ctaLabel;
                document.getElementById('hero-img').src = data.hero.imageUrl;
                document.getElementById('hero-badge').src = data.hero.badgeUrl;

                // 3. Populate Profil & Visi Misi
                document.getElementById('about-badge').textContent = data.about.profile.badge;
                document.getElementById('about-desc').textContent = data.about.profile.description;
                document.getElementById('about-img').src = data.about.profile.imageUrl;
                document.getElementById('vm-img').src = data.about.visionMission.imageUrl;
                document.getElementById('visi-badge').textContent = data.about.visionMission.badgeVision;
                document.getElementById('visi-text').textContent = data.about.visionMission.vision;
                document.getElementById('misi-badge').textContent = data.about.visionMission.badgeMission;
                const misiList = document.getElementById('misi-list');
                data.about.visionMission.missions.forEach(misi => {
                    misiList.innerHTML += `<li class="flex items-start gap-3"><svg class="w-5 h-5 text-brand-blue flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg><span>${misi}</span></li>`;
                });

                // 4. Populate Features
                document.getElementById('feat-title').textContent = data.features.title;
                document.getElementById('feat-subtitle').textContent = data.features.subtitle;
                const featContainer = document.getElementById('features-container');
                data.features.items.forEach(item => {
                    featContainer.innerHTML += `
                        <div class="bg-brand-blue text-white rounded-[1.5rem] p-8 transition-transform hover:-translate-y-1 hover:shadow-xl hover:shadow-blue-500/30">
                            ${item.icon}
                            <h3 class="text-xl font-bold mb-3">${item.title}</h3>
                            <p class="text-blue-100 text-sm leading-relaxed">${item.description}</p>
                        </div>
                    `;
                });

                // 5. Populate Fasilitas
                document.getElementById('fac-title').textContent = data.facilities.title;
                document.getElementById('fac-subtitle').textContent = data.facilities.subtitle;
                const facContainer = document.getElementById('facilities-container');
                data.facilities.items.forEach(item => {
                    facContainer.innerHTML += `
                        <div class="group relative overflow-hidden rounded-xl shadow-sm cursor-pointer aspect-square bg-slate-200" onclick="openLightbox('${item.imageUrl}')">
                            <img src="${item.imageUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex items-end p-4">
                                <h4 class="text-white font-semibold text-sm md:text-base group-hover:text-blue-300 transition-colors">${item.title}</h4>
                            </div>
                        </div>
                    `;
                });

                // 6. Populate Galeri
                document.getElementById('gal-title').textContent = data.gallery.title;
                document.getElementById('gal-subtitle').textContent = data.gallery.subtitle;
                const galContainer = document.getElementById('gallery-container');
                data.gallery.items.forEach(item => {
                    galContainer.innerHTML += `
                        <div class="group overflow-hidden rounded-xl cursor-pointer shadow-md bg-white border border-slate-200" onclick="openLightbox('${item.imageUrl}')">
                            <div class="h-40 md:h-56 overflow-hidden bg-slate-200">
                                <img src="${item.imageUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <div class="p-3 text-center">
                                <span class="text-sm font-medium text-slate-700">${item.title}</span>
                            </div>
                        </div>
                    `;
                });

                // 7. Populate PPDB
                document.getElementById('ppdb-title').textContent = data.ppdb.title;
                document.getElementById('ppdb-desc').textContent = data.ppdb.description;
                document.getElementById('ppdb-link').href = data.ppdb.formUrl;
                const ppdbReqs = document.getElementById('ppdb-reqs');
                data.ppdb.requirements.forEach(req => {
                    ppdbReqs.innerHTML += `<li class="flex items-center gap-2"><svg class="w-4 h-4 text-green-300 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg> ${req}</li>`;
                });

                // 8. Populate News (Home max 4, All view)
                document.getElementById('news-title-home').textContent = data.news.title;
                const homeNewsContainer = document.getElementById('news-container-home');
                const allNewsContainer = document.getElementById('news-container-all');
                
                const buildNewsCard = (item, index) => {
                    let tags = item.categories.map(cat => `<span class="bg-brand-blue text-white text-[10px] font-bold px-2 py-1 rounded-sm">${cat}</span>`).join('');
                    return `
                        <a href="javascript:void(0)" onclick="openNewsDetail(${index})" class="block group bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow border border-slate-100 pb-4 flex flex-col h-full">
                            <div class="relative h-48 overflow-hidden flex-shrink-0 bg-slate-200">
                                <img src="${item.imageUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <div class="p-5 flex flex-col flex-grow">
                                <div class="flex gap-2 mb-3 flex-wrap">${tags}</div>
                                <h3 class="font-bold text-slate-800 leading-snug mb-4 group-hover:text-brand-blue transition-colors line-clamp-2 flex-grow">${item.title}</h3>
                                <div class="flex items-center text-[11px] text-slate-400 font-medium uppercase tracking-wide gap-2 mt-auto pt-4 border-t border-slate-50">
                                    <span>${item.author}</span>
                                    <span>&bull;</span>
                                    <span>${item.date}</span>
                                </div>
                            </div>
                        </a>
                    `;
                };

                // Render max 4 for home
                data.news.items.slice(0, 4).forEach((item, idx) => {
                    homeNewsContainer.innerHTML += buildNewsCard(item, idx);
                });

                // Render all for All view
                data.news.items.forEach((item, idx) => {
                    allNewsContainer.innerHTML += buildNewsCard(item, idx);
                });

                // 9. Populate Footer
                document.getElementById('footer-col1-title').textContent = data.footer.col1.title;
                document.getElementById('footer-col1-desc').textContent = data.footer.col1.description;
                document.getElementById('footer-col2-title').textContent = data.footer.col2.title;
                document.getElementById('footer-col2-content').textContent = data.footer.col2.content;
                document.getElementById('footer-map').src = data.footer.mapEmbed;
                document.getElementById('footer-copy').textContent = data.footer.copyright;
                
                const socialContainer = document.getElementById('footer-socials');
                const icons = {
                    facebook: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" /></svg>',
                    twitter: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>',
                    instagram: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>'
                };
                data.footer.socialMedia.forEach(link => {
                    socialContainer.innerHTML += `<a href="${link.url}" target="_blank" title="${link.name}" class="bg-white/10 p-2 rounded-full hover:bg-white/20 transition-colors">${icons[link.icon.toLowerCase()] || icons.facebook}</a>`;
                });

                // 10. Populate WhatsApp
                document.getElementById('wa-greeting').textContent = data.whatsapp.greeting;
                document.getElementById('wa-subgreeting').textContent = data.whatsapp.subGreeting;
                document.getElementById('wa-reply-time').textContent = data.whatsapp.replyTime;
                
                const waContacts = document.getElementById('wa-contacts');
                data.whatsapp.contacts.forEach(contact => {
                    waContacts.innerHTML += `
                        <a href="https://wa.me/${contact.number}" target="_blank" class="flex items-center gap-3 p-3 hover:bg-slate-50 rounded-lg transition-colors border-b border-slate-50 last:border-0 group">
                            <div class="bg-[#25D366] text-white p-2 rounded-full group-hover:scale-110 transition-transform">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path d="M13.6 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.93 7.93 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.57 6.57 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>
                            </div>
                            <div>
                                <p class="text-sm font-semibold text-slate-700">${contact.role}</p>
                                <p class="text-xs text-slate-500">${contact.name}</p>
                            </div>
                        </a>
                    `;
                });

            } catch (error) {
                console.error("Gagal memuat data:", error);
                document.getElementById('hero-title').innerHTML = "Kesalahan memuat <br/> <span class='text-brand-blue'>Data JSON</span>";
            }

            // WA Widget External Click Logic
            const waToggle = document.getElementById('wa-toggle');
            const waPopup = document.getElementById('wa-popup');
            waToggle.addEventListener('click', () => waPopup.classList.toggle('hidden'));
            
            document.addEventListener('click', (e) => {
                if (!waToggle.contains(e.target) && !waPopup.contains(e.target)) {
                    waPopup.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
